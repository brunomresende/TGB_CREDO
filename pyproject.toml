[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "credal-cp-tgb"
version = "0.1.0"
description = "Implementação didática e reproduzível do CREDO para regressão."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Bruno M. Resende"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.14",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "matplotlib>=3.9",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]
bart = ["pymc==5.26.1", "pymc-bart==0.11.0", "arviz==0.22.0"]
desenvolvimento = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]
completo = [
  "catboost>=1.2",
  "pymc==5.26.1",
  "pymc-bart==0.11.0",
  "arviz==0.22.0",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
credal-cp-executar = "credal_cp_tgb.linha_comando:principal"

[tool.hatch.build.targets.wheel]
packages = ["src/credal_cp_tgb"]

[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["teste_*.py"]
python_functions = ["teste_*"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
